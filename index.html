<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage Carousel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: transparent; }
  body { font-family: Arial, sans-serif; }
  .carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    line-height: 0;
    background: #111;
    touch-action: pan-y;
  }
  .track {
    display: flex;
    width: 100%;
    transform: translateX(0);
    transition: transform .45s ease;
    will-change: transform;
  }
  .slide {
    flex: 0 0 100%;
    width: 100%;
    display: block;
    line-height: 0;
  }
  .slide img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1920 / 650;
    object-fit: cover;
    margin: 0;
    padding: 0;
  }
  .arrow {
    position: absolute;
    z-index: 2;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    padding: 0;
    color: #fff;
    background: rgba(0,0,0,.55);
    font: 32px/1 Arial, sans-serif;
    cursor: pointer;
  }
  .arrow:hover, .arrow:focus-visible { background: rgba(0,0,0,.8); }
  .prev { left: 14px; }
  .next { right: 14px; }
  .dots {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    line-height: 1;
  }
  .dot {
    width: 10px;
    height: 10px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.58);
    cursor: pointer;
    box-shadow: 0 0 2px rgba(0,0,0,.3);
  }
  .dot[aria-current="true"] { background: #fff; transform: scale(1.15); }
  @media (max-width: 600px) {
    .arrow { width: 34px; height: 34px; font-size: 26px; }
    .prev { left: 8px; }
    .next { right: 8px; }
    .dots { bottom: 8px; gap: 7px; }
    .dot { width: 8px; height: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { transition: none; }
  }
</style>
</head>
<body>
<div class="carousel" id="homepage-carousel" aria-label="Featured stories carousel">
  <div class="track">
    <!-- Replace each href with the destination page for that slide. -->
    <a class="slide" href="https://theaspc1nsider015.wordpress.com" aria-label="Open slide 1 destination">
      <img src="https://theaspc1nsider015.wordpress.com/wp-content/uploads/2026/10/1.png" alt="Featured story 1">
    </a>
    <a class="slide" href="https://theaspc1nsider015.wordpress.com" aria-label="Open slide 2 destination">
      <img src="https://theaspc1nsider015.wordpress.com/wp-content/uploads/2026/10/2.png" alt="Featured story 2">
    </a>
    <a class="slide" href="https://theaspc1nsider015.wordpress.com" aria-label="Open slide 3 destination">
      <img src="https://theaspc1nsider015.wordpress.com/wp-content/uploads/2026/10/3.png" alt="Featured story 3">
    </a>
    <a class="slide" href="https://theaspc1nsider015.wordpress.com" aria-label="Open slide 4 destination">
      <img src="https://theaspc1nsider015.wordpress.com/wp-content/uploads/2026/10/4.png" alt="Featured story 4">
    </a>
    <a class="slide" href="https://theaspc1nsider015.wordpress.com" aria-label="Open slide 5 destination">
      <img src="https://theaspc1nsider015.wordpress.com/wp-content/uploads/2026/10/5.png" alt="Featured story 5">
    </a>
  </div>
  <button class="arrow prev" type="button" aria-label="Previous slide">&#8249;</button>
  <button class="arrow next" type="button" aria-label="Next slide">&#8250;</button>
  <div class="dots" aria-label="Choose slide">
    <button class="dot" type="button" aria-label="Go to slide 1" aria-current="true"></button>
    <button class="dot" type="button" aria-label="Go to slide 2" aria-current="false"></button>
    <button class="dot" type="button" aria-label="Go to slide 3" aria-current="false"></button>
    <button class="dot" type="button" aria-label="Go to slide 4" aria-current="false"></button>
    <button class="dot" type="button" aria-label="Go to slide 5" aria-current="false"></button>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('homepage-carousel');
  if (!root) return;
  const track = root.querySelector('.track');
  const slides = [...root.querySelectorAll('.slide')];
  const dots = [...root.querySelectorAll('.dot')];
  const prev = root.querySelector('.prev');
  const next = root.querySelector('.next');
  let index = 0;
  let timer = null;
  let startX = null;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(n) {
    index = (n + slides.length) % slides.length;
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === index)));
  }
  function stop() {
    if (timer) window.clearInterval(timer);
    timer = null;
  }
  function start() {
    stop();
    if (!reducedMotion) timer = window.setInterval(() => show(index + 1), 5000);
  }
  prev.addEventListener('click', () => { show(index - 1); start(); });
  next.addEventListener('click', () => { show(index + 1); start(); });
  dots.forEach((dot, i) => dot.addEventListener('click', () => { show(i); start(); }));
  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', start);
  root.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; }, {passive:true});
  root.addEventListener('touchend', e => {
    if (startX === null) return;
    const delta = e.changedTouches[0].clientX - startX;
    if (Math.abs(delta) > 45) { show(index + (delta < 0 ? 1 : -1)); start(); }
    startX = null;
  }, {passive:true});
  show(0);
  start();
})();
</script>
</body>
</html>
